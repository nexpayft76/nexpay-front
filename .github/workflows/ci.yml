name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, tipos/build y tests unitarios y de componentes (Vitest).
  verificar:
    name: Lint, build y Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # Tests end to end (Playwright, Chromium). El backend va simulado: no hace falta nexpay-back.
  e2e:
    name: Tests end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      # Si algo falla, el reporte con capturas y trazas queda descargable desde la ejecución.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-e2e
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
